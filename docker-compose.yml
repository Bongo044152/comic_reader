services:
  backend:
    build: ./backend
    image: comic-backend
    ports:
      - "5090:5090" # environment.PORT
      - "127.0.0.1:4096:4096" # loopback only; environment.ADMIN_PORT
    user: "1000:1000"

    # see: https://docs.docker.com/reference/compose-file/services/#logging
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
    environment:
      DB_PATH: "/data/app.db"
      PORT: "5090" # port the backend listens on
      ADMIN_PORT: "4096" # admin server port inside the container
      LOG_LEVEL: "info" # backend logging level: https://getpino.io/#/docs/api?id=loggerlevel-string-gettersetter
      SESSION_SECRET: "${SESSION_SECRET:?SESSION_SECRET is required}" # read from the shell or .env
    volumes:
      # Docker creates this named volume on first start; SQLite creates app.db.
      - dbdata:/data
  frontend:
    build: ./frontend
    image: comic-frontend
    ports:
      - "5173:5173" # Vite dev server
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      # Required, no default. The Vite proxy forwards /api from inside this container,
      # so `localhost` would point to the frontend itself. Use the service name and the
      # container-side port, which must match backend's environment.PORT.
      VITE_PROXY_TARGET: "http://backend:5090"
volumes:
  dbdata:
